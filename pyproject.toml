[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/tpu_benchmark", "src/tpu_benchmark/baseline/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/tpu_benchmark/baseline", "data", "results", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gpu_pilot"]
