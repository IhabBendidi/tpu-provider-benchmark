# Replace all provider/billing observations before collecting a real result.
[run]
run_id = "transcriptomics-1gpu"
mode = "gpu_only"
seed = 20261005
output_dir = "results"
artifact_dir = "artifacts"
artifact_max_bytes = 10737418240
precision = "bf16"

[provider]
name = "GCP"
region = "us-east5-a"
instance_type = "tputrial-v6e-worker"
gpu_model = "Google TPU v6e (legacy config field)"
gpu_count = 4
node_count = 1
network_description = "v6e 4x4 slice; 4 chips per host"
storage_description = "cached inputs; worker-local boot disk"

[billing]
currency = "USD"
configuration_hourly_cost = 0.0
tax_included = false
price_source = "Unknown; zero is a placeholder and is not free compute"
observed_at_utc = "2026-10-06T00:00:00Z"

[synthetic]
profile = "provider_full"
dataset_size = 100000
validation_sample_count = 10000
feature_count = 8192
hidden_size = 4096
latent_size = 64
masking_rate = 0.15
sparsity_rate = 0.60
global_batch_size = 512
micro_batch_size_per_rank = 32
expected_world_size = 4
num_workers = 0

[timing]
warmup_seconds = 600
measurement_seconds = 1200
measurement_repetitions = 3
fixed_job_updates = 5000
